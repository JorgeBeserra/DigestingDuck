name: Desktop multiplataforma
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar mudança de versão
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 -m unittest discover -s packaging -p 'test_release_version.py'
          python3 packaging/release_version.py
  legacy-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build tools/DigestingDuck.LegacyExport -c Release
      - name: Test legacy database export
        shell: pwsh
        run: |
          $env:LEGACY_EXPORT_DLL = "$pwd/tools/DigestingDuck.LegacyExport/bin/Release/net9.0/DigestingDuck.LegacyExport.dll"
          dotnet test tests/DigestingDuck.LegacyExport.Tests -c Release
      - run: dotnet publish tools/DigestingDuck.LegacyExport -c Release -r win-x64 --self-contained true -o legacy-export
      - uses: actions/upload-artifact@v4
        with:
          name: DigestingDuck-LegacyExport-win-x64
          path: legacy-export/
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-15
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Testes do núcleo
        run: dotnet test tests/DigestingDuck.Core.Tests/DigestingDuck.Core.Tests.csproj -c Release
      - name: Testes da interface sem display
        run: dotnet test tests/DigestingDuck.Desktop.Tests/DigestingDuck.Desktop.Tests.csproj -c Release
      - name: Publicar aplicativo independente do runtime
        run: dotnet publish src/DigestingDuck.Desktop/DigestingDuck.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishTrimmed=false -o publish/${{ matrix.rid }}
      - name: Preparar Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Instalador Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup compiler not found" }
          & $compiler.FullName "/DAppVersion=$env:VERSION" "/DRuntimeId=$env:RID" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pacote macOS ou Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: bash packaging/package-unix.sh "$RID" "$VERSION" "publish/$RID" artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: DigestingDuck-${{ matrix.rid }}
          path: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.tar.gz
          if-no-files-found: error
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, desktop, legacy-export]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: DigestingDuck-*
          path: artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: DigestingDuck-LegacyExport-win-x64
          path: legacy-export
      - name: Reunir instaladores
        run: |
          find artifacts -mindepth 2 -type f ! -path 'artifacts/DigestingDuck-LegacyExport-*/*' \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' \) -exec mv {} artifacts/ \;
          find artifacts -mindepth 1 -maxdepth 1 -type d -exec rm -r {} \;
      - name: Compactar exportador legado
        run: |
          cd legacy-export
          zip -r "../artifacts/DigestingDuck-LegacyExport-win-x64.zip" .
      - name: Publicar tag e release com artefatos
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            target=$(git rev-list -n 1 "$tag")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::A tag $tag já aponta para outro commit. Aumente a versão ou reexecute a execução original."
              exit 1
            fi
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes --draft "${flags[@]}"
          fi
          gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
